# Phase II (P2) shadow lane: B1.4 privacy-plane consolidation.
#
# SHADOW STATUS (P2-C3): this workflow produces evidence only. Its single
# check ("B1.4 Privacy Consolidated Plane") is NOT in the required-contexts
# contract, so it cannot satisfy, weaken, or mutate merge authority. It runs
# the exact predecessor proof commands from ci.yml jobs b14-p0..b14-p7 inside
# ONE shared immutable substrate (one checkout, one Python install, one
# Postgres service, one template migration) with per-proof isolated logical
# databases cloned from the migrated template (P2-C6).
#
# physics-exempt: advisory-merge-group - Phase II shadow lane: must observe merge_group speculative SHAs to build the same-SHA paired corpus (P2-C2, s4.5). Non-authoritative; throttled by single-job topology (P2-C7).
# physics-exempt: advisory-pr-paths - Phase II shadow lane: must observe every PR class (trust, docs-only, governance) unfiltered to prove selectivity parity. Promotion adds its context to the contract, which retires these exemptions.
name: B1.4 Privacy Consolidated Plane

on:
  merge_group:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ADJUDICATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  b14-privacy-consolidated:
    name: B1.4 Privacy Consolidated Plane
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      TESTING: '1'
      CI: 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ADJUDICATED_SHA }}
          fetch-depth: 0

      - name: Adjudication SHA check
        run: |
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          echo "GITHUB_SHA=${{ github.sha }}"
          echo "ADJUDICATED_SHA=${{ env.ADJUDICATED_SHA }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ env.ADJUDICATED_SHA }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Single shared immutable substrate build (replaces 8 per-job installs).
      - name: Install consolidated proof dependencies (once)
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Create migration template database
        run: |
          python scripts/ci/b14_provision_template_dbs.py \
            --phase create-template \
            --maintenance-dsn postgresql://postgres:postgres@127.0.0.1:5432/postgres

      # Single migration replay into the template (replaces 7 per-job replays;
      # p6 never migrated). Schema authority is bound by b14_env_signature.
      - name: Migrate template once
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_template
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/b14_template
        run: |
          alembic upgrade head

      - name: Clone per-proof isolated databases
        run: |
          python scripts/ci/b14_provision_template_dbs.py \
            --phase clone-proofs \
            --maintenance-dsn postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: Record environment signature
        run: |
          python scripts/ci/b14_env_signature.py \
            --write artifacts/b14_consolidated/env_signature.json
          python scripts/ci/b14_env_signature.py \
            --check artifacts/b14_consolidated/env_signature.json

      # --- Proof p0 (verbatim ci.yml b14-p0 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P0 privacy authority lock
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p0_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p0_proof
            python scripts/ci/enforce_b14_p0_privacy_authority.py
            mkdir -p artifacts/b14_consolidated/p0
            pytest backend/tests/test_b14_p0_privacy_authority_contract.py -q --junitxml=artifacts/b14_consolidated/p0/junit.negative.xml | tee artifacts/b14_consolidated/p0/negative.log
            pytest backend/tests/test_b14_p0_event_lifecycle_runtime.py -q --junitxml=artifacts/b14_consolidated/p0/junit.lifecycle.xml | tee artifacts/b14_consolidated/p0/runtime.lifecycle.log
            pytest backend/tests/test_b14_p0_privacy_delete_api.py -q --junitxml=artifacts/b14_consolidated/p0/junit.delete_api.xml | tee artifacts/b14_consolidated/p0/runtime.delete_api.log
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p0 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p1 (verbatim ci.yml b14-p1 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P1 ingress contract sanitization
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p1_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p1_proof
            python scripts/ci/enforce_b14_p1_ingress_privacy.py
            pytest backend/tests/test_b14_p1_ingress_privacy_enforcer.py -q
            mkdir -p artifacts/b14_consolidated/p1
            pytest backend/tests/integration/test_b14_p1_ingress_privacy_runtime.py -q -rs --junitxml=artifacts/b14_consolidated/p1/junit.runtime.xml
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p1 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p2 (verbatim ci.yml b14-p2 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P2 session authority
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p2_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p2_proof
            python scripts/ci/enforce_b14_p2_session_authority.py
            pytest backend/tests/test_b14_p2_session_authority_enforcer.py -q
            mkdir -p artifacts/b14_consolidated/p2
            pytest backend/tests/integration/test_b14_p2_session_authority_runtime.py -q -rs --junitxml=artifacts/b14_consolidated/p2/junit.runtime.xml
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p2 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p3 (verbatim ci.yml b14-p3 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P3 attribution locality
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p3_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p3_proof
            python scripts/ci/enforce_b14_p3_attribution_locality.py
            pytest backend/tests/test_b14_p3_attribution_locality_enforcer.py -q
            mkdir -p artifacts/b14_consolidated/p3
            pytest backend/tests/integration/test_b14_p3_attribution_locality_runtime.py -q -rs --junitxml=artifacts/b14_consolidated/p3/junit.runtime.xml
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p3 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p4 (verbatim ci.yml b14-p4 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P4 retention and deletion
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p4_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p4_proof
            python scripts/ci/enforce_b14_p4_retention_deletion.py
            pytest backend/tests/test_b14_p4_retention_deletion_enforcer.py -q
            mkdir -p artifacts/b14_consolidated/p4
            pytest backend/tests/integration/test_b14_p4_retention_deletion_runtime.py -q -rs --junitxml=artifacts/b14_consolidated/p4/junit.runtime.xml
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p4 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p5 (verbatim ci.yml b14-p5 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P5 export log artifact no-leak
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p5_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p5_proof
            python scripts/ci/enforce_b14_p5_export_log_artifact_no_leak.py
            pytest backend/tests/test_b14_p5_export_log_artifact_no_leak_enforcer.py -q
            mkdir -p artifacts/b14_consolidated/p5
            pytest backend/tests/integration/test_b14_p5_export_log_artifact_no_leak_runtime.py -q -rs --junitxml=artifacts/b14_consolidated/p5/junit.runtime.xml | tee artifacts/b14_consolidated/p5/runtime.log
            if python scripts/ci/scan_b14_p5_artifacts.py --simulate-regression; then
              echo "expected scanner regression simulation to fail"
              exit 1
            fi
            python scripts/ci/scan_b14_p5_artifacts.py \
              --artifacts-dir artifacts/b14_consolidated/p5 \
              --canary "p5_artifact_canary@test.invalid"
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p5 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p6 (ci.yml b14-p6 commands; static suite runs against an
      # empty clone so conftest Gate C passes -- incumbent omits DATABASE_URL
      # and crash-masks behind tee; see provisioner docstring) ---
      - name: Consolidated proof B1.4-P6 proof-plane binding
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p6_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p6_proof
            if python scripts/ci/enforce_b14_p6_proof_plane_binding.py --simulate-regression; then
              echo "expected B1.4-P6 regression simulation to fail"
              exit 1
            fi
            mkdir -p artifacts/b14_consolidated/p6
            python scripts/ci/enforce_b14_p6_proof_plane_binding.py --report-json artifacts/b14_consolidated/p6/proof_plane_report.json
            pytest backend/tests/test_b14_p6_proof_plane_binding_enforcer.py -q --junitxml=artifacts/b14_consolidated/p6/junit.enforcer.xml | tee artifacts/b14_consolidated/p6/tests.log
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p6 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # --- Proof p7 (verbatim ci.yml b14-p7 commands; DB relocated) ---
      - name: Consolidated proof B1.4-P7 e2e privacy system
        run: |
          set +e
          (
            set -e
            set -o pipefail
            export DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/b14_p7_proof
            export MIGRATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/b14_p7_proof
            if python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py --simulate-regression; then
              echo "expected B1.4-P7 regression simulation to fail"
              exit 1
            fi
            mkdir -p artifacts/b14_consolidated/p7
            python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py \
              --artifacts-dir artifacts/b14_consolidated/p7
            pytest backend/tests/integration/test_b14_p7_e2e_privacy_system_proofs.py -q -rs --junitxml=artifacts/b14_consolidated/p7/junit.runtime.xml | tee artifacts/b14_consolidated/p7/runtime.log
            # The p7 test hardcodes its report root to artifacts/b14_p7
            # (product-test code, out of Phase II scope to rewrite). The proof
            # executes byte-identically; the lane relocates copies into its
            # own bundle. Under set -e a missing report fails the section.
            for f in p7_composed_runtime_report.json p7_negative_controls_report.json p7_runtime_logs.txt; do
              cp "artifacts/b14_p7/$f" "artifacts/b14_consolidated/p7/$f"
            done
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              python scripts/ci/capture_b14_p7_branch_protection_evidence.py \
                --output artifacts/b14_consolidated/p7/p7_branch_protection_evidence.json \
                --required-status-output artifacts/b14_consolidated/p7/p7_required_status_checks_live.json \
                --branch-protection-output artifacts/b14_consolidated/p7/p7_branch_protection_live.json \
                --require-live
            else
              python scripts/ci/capture_b14_p7_branch_protection_evidence.py \
                --output artifacts/b14_consolidated/p7/p7_branch_protection_evidence.json \
                --required-status-output artifacts/b14_consolidated/p7/p7_required_status_checks_live.json \
                --branch-protection-output artifacts/b14_consolidated/p7/p7_branch_protection_live.json
            fi
            cp docs/forensics/legal/b14_p7_legal_compliance_signoff.json artifacts/b14_consolidated/p7/p7_legal_signoff.json
            if python scripts/ci/scan_b14_p7_artifacts.py --simulate-regression; then
              echo "expected scanner regression simulation to fail"
              exit 1
            fi
            mkdir -p artifacts/b14_consolidated/p7/privacy_bundle
            cp artifacts/b14_consolidated/p7/p7_composed_runtime_report.json artifacts/b14_consolidated/p7/privacy_bundle/
            cp artifacts/b14_consolidated/p7/p7_negative_controls_report.json artifacts/b14_consolidated/p7/privacy_bundle/
            cp artifacts/b14_consolidated/p7/p7_branch_protection_evidence.json artifacts/b14_consolidated/p7/privacy_bundle/
            for optional in \
              artifacts/b14_consolidated/p7/p7_required_status_checks_live.json \
              artifacts/b14_consolidated/p7/p7_branch_protection_live.json
            do
              if [ -f "$optional" ]; then
                cp "$optional" artifacts/b14_consolidated/p7/privacy_bundle/
              fi
            done
            cp artifacts/b14_consolidated/p7/p7_legal_signoff.json artifacts/b14_consolidated/p7/privacy_bundle/
            cp artifacts/b14_consolidated/p7/p7_runtime_logs.txt artifacts/b14_consolidated/p7/privacy_bundle/
            python scripts/ci/scan_b14_p7_artifacts.py \
              --artifacts-dir artifacts/b14_consolidated/p7/privacy_bundle \
              --canary "p7_artifact_canary@test.invalid" \
              --report-json artifacts/b14_consolidated/p7/p7_artifact_scan_report.json
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py \
                --require-runtime-execution \
                --require-live-branch-protection \
                --junit-xml artifacts/b14_consolidated/p7/junit.runtime.xml \
                --artifacts-dir artifacts/b14_consolidated/p7
            else
              python scripts/ci/enforce_b14_p7_e2e_privacy_system_proofs.py \
                --require-runtime-execution \
                --junit-xml artifacts/b14_consolidated/p7/junit.runtime.xml \
                --artifacts-dir artifacts/b14_consolidated/p7
            fi
          )
          RC=$?
          python3 scripts/ci/b14_record_proof_result.py --proof p7 --return-code "$RC" --artifacts-dir artifacts/b14_consolidated --sha "${{ env.ADJUDICATED_SHA }}"
          exit 0

      # Terminal adjudication: GREEN iff 8/8 proofs recorded rc=0 on this SHA
      # with clean JUnit. No wrapper-green-over-missing-child (H-P2-11).
      - name: Aggregate consolidated verdict
        if: always()
        run: |
          python3 scripts/ci/b14_record_proof_result.py --aggregate \
            --artifacts-dir artifacts/b14_consolidated \
            --sha "${{ env.ADJUDICATED_SHA }}"

      - name: Upload consolidated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b14-consolidated-artifacts
          path: artifacts/b14_consolidated
          if-no-files-found: error
